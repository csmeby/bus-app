name: Unsigned iOS build (for sideloading)

# Manual trigger only — an unsigned macOS build isn't needed on every push,
# and macOS runner minutes cost 10x a normal Linux runner even on the free
# tier, so this shouldn't run automatically on every commit.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          gem list cocoapods -i || sudo gem install cocoapods
          pod --version
          pod install --repo-update
          ls -la

      - name: Build unsigned .app
        working-directory: ios
        run: |
          ls -la
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | xargs)
          echo "Using workspace $WORKSPACE, scheme $SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package .ipa
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 1 -name "*.app" | head -n1)
          echo "Found app at $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r bus-unsigned.ipa Payload
          mv bus-unsigned.ipa ..

      - uses: actions/upload-artifact@v4
        with:
          name: bus-unsigned-ipa
          path: bus-unsigned.ipa
          retention-days: 14
