name: Signed iOS build (TestFlight / App Store / sideloading)

# Manual trigger only — a macOS build isn't needed on every push, and macOS
# runner minutes cost 10x a normal Linux runner even on the free tier, so
# this shouldn't run automatically on every commit.
#
# ── Required repo secrets (Settings → Secrets and variables → Actions) ──
#   BUILD_CERTIFICATE_BASE64    base64 of your exported .p12 signing cert
#                                (macOS: `base64 -i Certificate.p12 | pbcopy`)
#   P12_PASSWORD                 the password you set when exporting that .p12
#                                 from Keychain Access
#   BUILD_PROVISION_PROFILE_BASE64
#                                 base64 of the .mobileprovision file
#                                 (macOS: `base64 -i Profile.mobileprovision | pbcopy`)
#   KEYCHAIN_PASSWORD             any password — just used to lock/unlock the
#                                  throwaway keychain this job creates and
#                                  destroys each run, doesn't need to match
#                                  anything else
#   APPLE_TEAM_ID                 your 10-character Team ID (Apple Developer
#                                  account → Membership)
#
# The provisioning profile's UUID and bundle identifier are read directly out
# of the .mobileprovision file at build time (see "Read profile UUID/bundle
# ID" below) — no need to hardcode or keep those in sync as secrets.
#
# Export method is picked at trigger time (Actions tab → Run workflow →
# export_method dropdown) since the cert/profile pair you upload as secrets
# has to MATCH whichever method you pick:
#   development  → an "Apple Development" cert + a Development profile
#                  (device-UDID-limited, same as Xcode's local run/debug signing)
#   ad-hoc       → an "Apple Distribution" cert + an Ad Hoc profile
#                  (also device-UDID-limited, but this is what direct
#                  sideload tools like AltStore actually expect)
#   app-store    → the SAME "Apple Distribution" cert + an App Store
#                  Connect profile — for TestFlight/App Store submission,
#                  not sideloading
# BUILD_CERTIFICATE_BASE64/BUILD_PROVISION_PROFILE_BASE64 always just hold
# whichever ONE pair you currently have loaded — swap the GitHub secrets'
# contents when you switch which method you're building for.
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method (must match the cert/profile pair currently in your secrets)"
        type: choice
        default: app-store
        options:
          - app-store
          - ad-hoc
          - development

env:
  EXPORT_METHOD: ${{ inputs.export_method }}

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          gem list cocoapods -i || sudo gem install cocoapods
          pod --version
          pod install --repo-update

      # Standard GitHub Actions iOS signing recipe: decode the cert +
      # profile secrets, import the cert into a fresh throwaway keychain
      # (so this job's signing identity doesn't touch/depend on the
      # runner's default keychain state), and install the profile where
      # Xcode expects to find it.
      - name: Import signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/build_profile.mobileprovision

      # Read profile UUID/bundle ID: the exported plist's Entitlements block
      # carries the bundle ID (as "application-identifier", prefixed with
      # the team ID — e.g. "ABCDE12345.com.csmeby.bus"), and UUID is a
      # top-level key. Doing it this way means ExportOptions.plist below
      # never needs the bundle ID or profile UUID hardcoded/kept in sync by
      # hand.
      - name: Read profile UUID/bundle ID
        id: profile
        run: |
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          PLIST_PATH=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PROFILE_PATH" > "$PLIST_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST_PATH")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST_PATH")
          BUNDLE_ID=${APP_ID#*.}

          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "Profile UUID: $UUID"
          echo "Bundle ID: $BUNDLE_ID"

      - name: Build signed archive
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "Using workspace $WORKSPACE, scheme $SCHEME"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      - name: Write ExportOptions.plist
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
          BUNDLE_ID: ${{ steps.profile.outputs.bundle_id }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export signed .ipa
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Locate exported .ipa
        working-directory: ios
        run: find build/ipa -name "*.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: century-tree-transit-signed-ipa
          path: ios/build/ipa/*.ipa
          retention-days: 14

      # Best-effort cleanup so the throwaway keychain doesn't linger past
      # this job even if an earlier step already failed.
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
