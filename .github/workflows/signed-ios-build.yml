name: Signed iOS build (TestFlight / App Store / sideloading)

# Manual trigger only — a macOS build isn't needed on every push, and macOS
# runner minutes cost 10x a normal Linux runner even on the free tier, so
# this shouldn't run automatically on every commit.
#
# ── Required repo secrets (Settings → Secrets and variables → Actions) ──
#   GOOGLE_MAPS_API_KEY          Maps SDK key from Google Cloud Console
#                                 (see app.config.js/.env.example) - needed
#                                 by the prebuild step below
#   BUILD_CERTIFICATE_BASE64    base64 of your exported .p12 signing cert
#                                (macOS: `base64 -i Certificate.p12 | pbcopy`)
#   P12_PASSWORD                 the password you set when exporting that .p12
#                                 from Keychain Access
#   BUILD_PROVISION_PROFILE_BASE64
#                                 base64 of the .mobileprovision file
#                                 (macOS: `base64 -i Profile.mobileprovision | pbcopy`)
#   KEYCHAIN_PASSWORD             any password — just used to lock/unlock the
#                                  throwaway keychain this job creates and
#                                  destroys each run, doesn't need to match
#                                  anything else
#   APPLE_TEAM_ID                 your 10-character Team ID (Apple Developer
#                                  account → Membership)
#
# Only needed for export_method=app-store-connect, to auto-upload the build
# to App Store Connect/TestFlight (skipped entirely for ad-hoc/development —
# see the upload step's `if:`). This is a DIFFERENT credential from the APNs
# .p8 used for push notifications — don't reuse that one.
#   APP_STORE_CONNECT_API_KEY_BASE64
#                                 base64 of an App Store Connect API key .p8
#                                 (appstoreconnect.apple.com → Users and
#                                 Access → Integrations → Keys → generate one
#                                 with the "App Manager" role — the .p8 only
#                                 downloads ONCE, save it before leaving that page)
#   APP_STORE_CONNECT_KEY_ID      shown next to the key on that same page
#   APP_STORE_CONNECT_ISSUER_ID   shown at the top of that same Keys page
#
# The provisioning profile's UUID and bundle identifier are read directly out
# of the .mobileprovision file at build time (see "Read profile UUID/bundle
# ID" below) — no need to hardcode or keep those in sync as secrets.
#
# Export method is picked at trigger time (Actions tab → Run workflow →
# export_method dropdown) since the cert/profile pair you upload as secrets
# has to MATCH whichever method you pick:
#   development  → an "Apple Development" cert + a Development profile
#                  (device-UDID-limited, same as Xcode's local run/debug signing)
#   ad-hoc       → an "Apple Distribution" cert + an Ad Hoc profile
#                  (also device-UDID-limited, but this is what direct
#                  sideload tools like AltStore actually expect)
#   app-store-connect → the SAME "Apple Distribution" cert + an App Store
#                  Connect profile — for TestFlight/App Store submission,
#                  not sideloading. ("app-store" is the same thing but is
#                  the OLD/deprecated name for this method as of Xcode 16 —
#                  still accepted for back-compat, but use the current name.)
# BUILD_CERTIFICATE_BASE64/BUILD_PROVISION_PROFILE_BASE64 always just hold
# whichever ONE pair you currently have loaded — swap the GitHub secrets'
# contents when you switch which method you're building for.
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method (must match the cert/profile pair currently in your secrets)"
        type: choice
        default: app-store-connect
        options:
          - app-store-connect
          - ad-hoc
          - development

env:
  EXPORT_METHOD: ${{ inputs.export_method }}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # App Store Connect now rejects uploads not built with the iOS 26 SDK
      # (Xcode 26+) — macos-15's default Xcode was 16.4 (iOS 18.5 SDK), which
      # got a hard 409 validation failure on upload. macos-latest tracks
      # GitHub's newest runner image, and this pins the actual Xcode
      # selection explicitly (multiple Xcode versions are normally
      # preinstalled side by side on these images) so it doesn't silently
      # drift back to an old default again later.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Prebuild native iOS project
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npx expo prebuild --platform ios --no-install

      # Diagnostic: prints exactly what expo prebuild generated, straight
      # from app.json's plugin config — settles whether "no valid
      # aps-environment entitlement string" is because this file is wrong
      # (still says development, or is missing the key) vs. something going
      # wrong later at codesign/export time despite this being correct.
      - name: Print generated entitlements (pre-signing)
        working-directory: ios
        run: |
          ENTITLEMENTS_FILE=$(find . -maxdepth 2 -name "*.entitlements" | head -n1)
          echo "Entitlements file: $ENTITLEMENTS_FILE"
          cat "$ENTITLEMENTS_FILE"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          gem list cocoapods -i || sudo gem install cocoapods
          pod --version
          pod install --repo-update

      # Standard GitHub Actions iOS signing recipe: decode the cert +
      # profile secrets, import the cert into a fresh throwaway keychain
      # (so this job's signing identity doesn't touch/depend on the
      # runner's default keychain state), and install the profile where
      # Xcode expects to find it.
      - name: Import signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/build_profile.mobileprovision

      # Read profile UUID/bundle ID: the exported plist's Entitlements block
      # carries the bundle ID (as "application-identifier", prefixed with
      # the team ID — e.g. "ABCDE12345.com.csmeby.bus"), and UUID is a
      # top-level key. Doing it this way means ExportOptions.plist below
      # never needs the bundle ID or profile UUID hardcoded/kept in sync by
      # hand.
      - name: Read profile UUID/bundle ID
        id: profile
        run: |
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          PLIST_PATH=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PROFILE_PATH" > "$PLIST_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST_PATH")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST_PATH")
          BUNDLE_ID=${APP_ID#*.}

          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "Profile UUID: $UUID"
          echo "Bundle ID: $BUNDLE_ID"

      - name: Build signed archive
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          # Must match whichever cert type the export_method's profile pairs
          # with (see the top-of-file comment) — without this, Xcode falls
          # back to the generated project's own default identity (an "iOS
          # Development" alias) regardless of which cert/profile was
          # actually imported, which is exactly what produced:
          # "No signing certificate 'iOS Development' found" on an
          # ad-hoc/app-store-connect run using a Distribution cert.
          if [ "$EXPORT_METHOD" = "development" ]; then
            CODE_SIGN_IDENTITY="Apple Development"
          else
            CODE_SIGN_IDENTITY="Apple Distribution"
          fi

          echo "Using workspace $WORKSPACE, scheme $SCHEME, identity $CODE_SIGN_IDENTITY"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      # Diagnostic: what actually got embedded in the ARCHIVED app's code
      # signature — the authoritative answer to whether aps-environment made
      # it through codesign, independent of what the source .entitlements
      # file said pre-signing.
      - name: Print archived app's signed entitlements
        working-directory: ios
        run: |
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n1)
          echo "App: $APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2>&1

      - name: Write ExportOptions.plist
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
          BUNDLE_ID: ${{ steps.profile.outputs.bundle_id }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export signed .ipa
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Locate exported .ipa
        working-directory: ios
        run: find build/ipa -name "*.ipa"

      # Diagnostic: entitlements in the FINAL exported .ipa — export can
      # theoretically re-sign/repackage, so this is the true last word on
      # what ships, in case it ever differs from the archive step above.
      - name: Print exported .ipa's signed entitlements
        working-directory: ios
        run: |
          IPA_PATH=$(find build/ipa -name "*.ipa" | head -n1)
          rm -rf /tmp/ipa_check
          mkdir -p /tmp/ipa_check
          unzip -q "$IPA_PATH" -d /tmp/ipa_check
          APP_PATH=$(find /tmp/ipa_check/Payload -maxdepth 1 -name "*.app" | head -n1)
          echo "App: $APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: century-tree-transit-signed-ipa
          path: ios/build/ipa/*.ipa
          retention-days: 14

      # Only for a real TestFlight/App Store run — uploading an ad-hoc or
      # development build here would just get rejected by App Store Connect
      # (wrong profile type), so this is skipped entirely for those methods
      # rather than attempting and failing.
      - name: Upload to App Store Connect
        if: ${{ inputs.export_method == 'app-store-connect' }}
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ipa -name "*.ipa" | head -n1)

          # altool looks for the API key in one of a few fixed locations by
          # naming convention — AuthKey_<key-id>.p8 under
          # ~/.appstoreconnect/private_keys is the one that doesn't collide
          # with anything else this job touches.
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            -o ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      # Best-effort cleanup so the throwaway keychain doesn't linger past
      # this job even if an earlier step already failed.
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys || true
