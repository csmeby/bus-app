name: Unsigned iOS build (for sideloading)

# Manual trigger only — an unsigned macOS build isn't needed on every push,
# and macOS runner minutes cost 10x a normal Linux runner even on the free
# tier, so this shouldn't run automatically on every commit.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          gem list cocoapods -i || sudo gem install cocoapods
          pod --version
          pod install --repo-update

      - name: Build unsigned .app
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)

          echo "Workspace: $WORKSPACE"
          echo "Available schemes:"
          xcodebuild -workspace "$WORKSPACE" -list

          SCHEME=$(basename "$WORKSPACE" .xcworkspace)

          echo "Using scheme: $SCHEME"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Locate built app
        working-directory: ios
        run: |
          find build -name "*.app"

      - name: Package .ipa
        working-directory: ios
        run: |
          APP_PATH=$(find build -name "*.app" | head -n1)

          if [ -z "$APP_PATH" ]; then
            echo "No .app found!"
            exit 1
          fi

          echo "Found app at $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          cd Payload/..
          zip -qry bus-unsigned.ipa Payload
          mv bus-unsigned.ipa ..

      - uses: actions/upload-artifact@v4
        with:
          name: bus-unsigned-ipa
          path: bus-unsigned.ipa
          retention-days: 14